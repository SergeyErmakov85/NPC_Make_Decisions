# unity_export/decision_agent.yaml  — конфигурация ML-Agents (mlagents-learn)
behaviors:
  DecisionAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      # --- Имитация MCDA-политики: раскомментировать на уровне B, шаг 2 ---
      # gail:
      #   strength: 0.3
      #   gamma: 0.99
      #   demo_path: Assets/Demos/MCDA_TOPSIS.demo
    # behavioral_cloning:
    #   demo_path: Assets/Demos/MCDA_TOPSIS.demo
    #   strength: 0.5
    #   steps: 50000
    keep_checkpoints: 5
    max_steps: 1500000
    time_horizon: 128
    summary_freq: 10000

environment_parameters:
  # Curriculum: начинаем с безопасной карты, постепенно поднимаем угрозу
  threat_level:
    curriculum:
      - name: Easy
        completion_criteria:
          measure: reward
          behavior: DecisionAgent
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.5
        value: 0.2
      - name: Medium
        completion_criteria:
          measure: reward
          behavior: DecisionAgent
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.7
        value: 0.55
      - name: Hard
        value: 0.85
